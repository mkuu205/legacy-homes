<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a3a" />
    <title>Legacy Homes — Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      img { width: 5rem; height: 5rem; margin-bottom: 1.5rem; }
      h1 { margin: 0 0 0.75rem; font-size: 1.75rem; }
      p { margin: 0 0 1.5rem; color: #475569; line-height: 1.6; }
      button { border: 0; border-radius: 0.5rem; padding: 0.75rem 1rem; background: #0ea5e9; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/legacy-homes-logo.png" alt="Legacy Homes" />
      <h1>You’re offline</h1>
      <p>Legacy Homes could not connect right now. Check your internet connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
